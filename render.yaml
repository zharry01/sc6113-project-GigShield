# Render Blueprint: New -> Blueprint -> select this repo
services:
  - type: web
    name: gigshield
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /app/data
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      # Optional after deployment: add CONTRACT_ADDRESS in the Render dashboard,
      # or register it from the dApp's Setup tab using the Admin wallet.
